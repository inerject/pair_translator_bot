[project]
name = "pair-translator-bot"
dynamic = ["version"]
requires-python = ">=3.13,<4"

dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.15,<3",
    "google-cloud-translate>=3,<4",
    "google-cloud-speech>=2,<3",
    "gflanguages>=0.7,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pair_translator_bot*"]

[tool.setuptools.dynamic]
version = {attr = "pair_translator_bot._version.__version__"}
